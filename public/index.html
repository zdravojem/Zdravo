<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <!-- The layout is scaled to the viewport by app.js (see --app-scale), so
         browser zoom would fight it; a 55" kiosk must also ignore stray pinches. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3b6d11" />
    <meta name="description" content="Kulinarični pomočnik — lokalni recepti za zdrav krožnik." />
    <title>Zdravo Jem</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/icons/pwa-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zdravo Jem" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/games.css" />
    <link rel="stylesheet" href="./styles/pwa.css" />

    <!-- Supabase URL + anon key. Generated from .env.local by `npm run env:build`
         and loaded before the app so config.js can read it synchronously. -->
    <script src="./env.js"></script>
  </head>
  <body>
    <div id="app" class="app-root"></div>
    <script type="module" src="./pwa/kiosk.js"></script>
    <script type="module" src="./pwa/register-sw.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
